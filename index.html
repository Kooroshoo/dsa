<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leetcode Cheat Sheet & Analyzer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>

    <header id="site-header" class="header-section">
        <div class="header-content">
            <h1 id="page-title">Loading...</h1>
            <p id="page-intro"></p>
        </div>
    </header>

    <main class="container">
        <section class="analyzer">
            <h2 class="section-title">Analyze a Problem</h2>
            <div class="custom-input-section">
                <textarea id="custom-desc" rows="4" placeholder="Paste a LeetCode problem (description, examples, constraints)..."></textarea>
                <div class="button-group">
                    <button id="clear-btn" class="secondary-btn">Clear</button>
                    <button id="analyze-btn">Analyze</button>
                </div>
            </div>
            <div id="custom-result"></div>
        </section>

        <div id="main-container"></div>

        <details class="preloaded-details">
            <summary>Practice Questions</summary>
            <div id="questions-container" class="questions-list">
                <p>Loading questions.md...</p>
            </div>
        </details>
    </main>

    <div id="template-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <h2 id="modal-title" style="margin-top: 0; color: var(--theme-color);">Algorithm Name</h2>
            <div id="modal-body" class="modal-body-content q-desc">
                <p>Loading template...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
